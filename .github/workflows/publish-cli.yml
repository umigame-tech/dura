name: Publish CLI

# Push a tag such as cli-v0.1.0 to stage cli/ on npm as @umigame-tech/dura.
# A maintainer then approves the staged version with 2FA (npm stage approve).
on:
  push:
    tags: ["cli-v*"]

permissions:
  contents: read
  id-token: write # npm trusted publishing (no token) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check that the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Tag $GITHUB_REF_NAME is not on main"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run cli:build
      - name: Check that the tag matches the package version
        run: |
          version=$(node -p "require('./cli/package.json').version")
          test "$GITHUB_REF_NAME" = "cli-v$version" || { echo "Tag $GITHUB_REF_NAME does not match cli/package.json version $version"; exit 1; }
          test "$(node cli/dist/dura.js -V)" = "$version"
      - name: Install npm with staged publishing
        run: npm install -g npm@^11.15.0
      - run: npm stage publish
        working-directory: cli
