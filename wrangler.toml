name = "dura"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
# No database_id: wrangler looks the database up by this name, so the id never
# has to be committed and Workers Builds can deploy straight from the repository.
database_name = "dura"
migrations_dir = "drizzle"

# Secrets: `npx wrangler secret put DURA_SETUP_TOKEN`
# [vars]
# DURA_NAME = "dura"
