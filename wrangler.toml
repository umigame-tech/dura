name = "dura"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "dura"
# Replace with the id printed by `npx wrangler d1 create dura`.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "drizzle"

# Secrets: `npx wrangler secret put DURA_SETUP_TOKEN`
# [vars]
# DURA_NAME = "dura"
